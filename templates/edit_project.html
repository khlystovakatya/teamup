{% extends "base.html" %}

{% block title %}Редактирование проекта{% endblock %}

{% block content %}
<h1 class="page-title">Редактировать проект</h1>

<div class="card create-project-card">
    {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/projects/{{ project.id }}/edit" class="form create-project-form">
        <div class="form-group">
            <label>Название проекта</label>
            <input 
                type="text"
                name="title"
                class="form-control"
                value="{{ project.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Описание</label>
            <textarea 
                name="description"
                class="form-control"
                required
            >{{ project.description }}</textarea>
        </div>

        <div class="form-group">
            <label>Количество участников</label>
            <input 
                type="number"
                name="max_participants"
                class="form-control"
                value="{{ project.max_participants }}"
                min="1"
                required
            >
        </div>

        <div class="form-actions">
            <button type="submit" class="button">
                Сохранить изменения
            </button>

            <a href="/projects/{{ project.id }}" class="button button-secondary">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
